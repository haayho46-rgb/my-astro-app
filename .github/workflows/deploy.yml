name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        run: |
          # Configure git
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Create/checkout gh-pages branch
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          git checkout -b gh-pages origin/gh-pages 2>/dev/null || git checkout --orphan gh-pages

          # Remove all files except .git
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} + || true

          # Copy dist contents
          cp -r dist/* .

          # Commit and push
          git add -A
          git commit -m "Deploy to GitHub Pages" --allow-empty
          git push -u origin gh-pages

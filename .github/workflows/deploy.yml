name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to gh-pages
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          # Remove old my-astro-app directory if it exists
          rm -rf my-astro-app

          # Create my-astro-app directory and copy dist contents
          mkdir -p my-astro-app
          cp -r dist/* my-astro-app/

          # Add and commit
          git add my-astro-app/
          git commit -m "Deploy to GitHub Pages" || echo "No changes to commit"
          git push origin gh-pages
